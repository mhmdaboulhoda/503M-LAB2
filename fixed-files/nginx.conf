# 503M edge. Students reach only this. The application is never exposed.
#
# Deliberately incomplete: no security headers are set here. Adding them is the
# student's task in the misconfiguration lab.

server {
    listen 80;
    server_name _;

    # Edge size limit, layered with the application's own upload check.
    client_max_body_size 10m;

    # Layer 1 fix (Part C): make the upload directory inert.
    #   ^~  wins at step 2 of nginx's location precedence and STOPS before the
    #       server-wide `~ \.php$` regex is ever consulted, so an uploaded
    #       /media/.../shell.php is served as bytes, never handed to PHP (kills B1).
    #   types { } + default_type application/octet-stream  empties the
    #       extension->MIME table and labels every file an opaque blob, so an
    #       .html is no longer text/html and an .svg no longer image/svg+xml;
    #       the browser picks no parser (kills B2). Both lines are needed: default_type
    #       only applies when nginx cannot infer a type.
    #   Content-Disposition: attachment  the browser saves instead of rendering.
    #   X-Content-Type-Options: nosniff  stops the browser overruling the type by
    #       sniffing the bytes. The three MIME lines only work together.
    #   `always`  applies the headers to error responses too.
    location ^~ /media/ {
        root /srv;
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        autoindex off;
    }

    location /static/ {
        alias /srv/static/;
        autoindex off;
    }

    # Any URL ending in .php is handed to the PHP interpreter. This is a
    # server-wide regex location, so by nginx's precedence rules it is consulted
    # for every request - including one for a file under /media/. An uploaded
    # /media/.../shell.php therefore runs instead of being served as bytes.
    # This is what makes the file-upload lab's web-shell step (B1) reproducible.
    location ~ \.php$ {
        root /srv;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
    }

    location / {
        proxy_pass http://app:8000;
        # $http_host, not $host: $host drops the port, and Django then compares
        # the browser's Origin (127.0.0.1:5001) against a host of 127.0.0.1
        # and rejects every POST as a CSRF failure.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
